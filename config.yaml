# AI 批改机器人 - 运行时配置
# 大部分环境变量从 .env 读, 这里放结构化配置

models:
  # 视觉模型
  # provider:  aliyun (阿里百炼 OpenAI 兼容)  |  doubao (字节火山方舟)  |  qwen (DashScope 原生)
  # 当前默认 aliyun, 一个 key 解决视觉+文本
  vision:
    provider: aliyun
    name: qwen-vl-plus          # 百炼平台可用的视觉模型
    temperature: 0.4
    max_tokens: 1024
    timeout_sec: 60

  # 语音识别
  # paraformer-v2 (file transcription) - 通过 OSS 上传, 便宜 (¥0.0001/秒)
  # 结果在 transcription_url 指向的 JSON 里, 含词级时间戳
  asr:
    provider: paraformer
    name: paraformer-v2
    sample_rate: 16000
    timeout_sec: 120

  # 文本润色 / 老师指令理解
  # provider:  aliyun (阿里百炼)  |  ark (火山方舟)  |  deepseek (官方)
  # 当前默认 aliyun, 跟视觉共用一个 key
  text:
    provider: ark
    name: ark-code-latest             
    temperature: 0.6
    max_tokens: 1024
    timeout_sec: 30

media:
  # 图片最大尺寸 (像素)
  image_max_dim: 2048
  image_quality: 85
  # 视频抽帧数
  video_frames: 6
  video_fps: 1
  video_scale: 720
  # 文件大小上限 (MB)
  image_max_mb: 20
  video_max_mb: 100

paths:
  cache_dir: data/cache
  db_path: data/ai_teacher.db
  log_dir: data/logs

logging:
  level: INFO
  rotation: 100 MB
  retention: 30 days
